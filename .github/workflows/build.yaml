name: Build Windows EXE
on:
  push:
    tags:
      - "v*"
jobs:
  generate-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Generate requirements.txt
        run: |
          nix develop --command pip freeze \
            | grep -iv 'pandas-stubs' \
            > requirements.txt
          test -s requirements.txt || { echo "requirements.txt is empty"; exit 1; }
      - name: Upload requirements.txt
        uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements.txt
  build-windows:
    needs: generate-requirements
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download requirements.txt
        uses: actions/download-artifact@v4
        with:
          name: requirements
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: >
          pyinstaller --onefile --add-data "data;data" --name hammah-quiz main.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hammah-quiz.exe
